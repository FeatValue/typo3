<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Module" />
<f:section name="Content">
<div class="featvalue-settings" style="max-width: 640px;">
    <f:if condition="{error}">
        <p style="color:#b42318;">{error}</p>
    </f:if>
    <f:if condition="{mailError}">
        <p style="color:#b42318;">{mailError}</p>
    </f:if>

    <f:if condition="{connected}">
        <f:then>
            <f:if condition="{siteType}">
                <f:then>
                    <p><f:translate key="settings.connected" extensionName="featvalue" /></p>

                    <f:if condition="{siteType} == 'client' && {clientId} < 1">
                        <form method="post" action="{moduleUrl}">
                            <input type="hidden" name="action" value="saveClient" />
                            <input type="hidden" name="formToken" value="{token}" />
                            <label><f:translate key="settings.client" extensionName="featvalue" /></label>
                            <select name="featvalue_client_id">
                                <f:for each="{clients}" as="client">
                                    <option value="{client.id}">{client.name}</option>
                                </f:for>
                            </select>
                            <button class="btn btn-default" type="submit"><f:translate key="settings.save" extensionName="featvalue" /></button>
                        </form>
                    </f:if>

                    <f:if condition="{ssoAvailable}">
                        <form method="post" action="{moduleUrl}">
                            <input type="hidden" name="action" value="saveSso" />
                            <input type="hidden" name="formToken" value="{token}" />
                            <label>
                                <input type="checkbox" name="sso_enabled" value="1" {f:if(condition: ssoEnabled, then: 'checked="checked"')} />
                                <f:translate key="settings.sso" extensionName="featvalue" />
                            </label>
                            <p><f:translate key="settings.ssoHelp" extensionName="featvalue" /></p>
                            <button class="btn btn-default" type="submit"><f:translate key="settings.save" extensionName="featvalue" /></button>
                        </form>
                    </f:if>

                    <form id="featvalue-disconnect-form" method="post" action="{moduleUrl}" hidden="hidden">
                        <input type="hidden" name="action" value="disconnect" />
                        <input type="hidden" name="formToken" value="{token}" />
                    </form>
                </f:then>
                <f:else>
                    <form method="post" action="{moduleUrl}">
                        <input type="hidden" name="action" value="saveSiteType" />
                        <input type="hidden" name="formToken" value="{token}" />
                        <fieldset class="mb-3">
                            <legend class="form-label"><f:translate key="settings.siteType" extensionName="featvalue" /></legend>
                            <p class="text-body-secondary"><f:translate key="settings.siteType.permanent" extensionName="featvalue" /></p>
                            <div class="mb-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="site_type" id="featvalue-site-type-client" value="client" required="required" />
                                    <label class="form-check-label" for="featvalue-site-type-client"><f:translate key="settings.siteType.client" extensionName="featvalue" /></label>
                                </div>
                                <div class="form-text ms-4"><f:translate key="settings.siteType.clientHelp" extensionName="featvalue" /></div>
                            </div>
                            <div class="mb-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="site_type" id="featvalue-site-type-agency" value="agency" />
                                    <label class="form-check-label" for="featvalue-site-type-agency"><f:translate key="settings.siteType.agency" extensionName="featvalue" /></label>
                                </div>
                                <div class="form-text ms-4"><f:translate key="settings.siteType.agencyHelp" extensionName="featvalue" /></div>
                            </div>
                        </fieldset>
                        <button class="btn btn-default" type="submit"><f:translate key="settings.save" extensionName="featvalue" /></button>
                    </form>
                </f:else>
            </f:if>
        </f:then>
        <f:else>
            <p><f:translate key="settings.notConnected" extensionName="featvalue" /></p>
            <p><a class="btn btn-default" href="{connectUrl}"><f:translate key="settings.connect" extensionName="featvalue" /></a></p>
        </f:else>
    </f:if>
</div>
</f:section>
</html>
